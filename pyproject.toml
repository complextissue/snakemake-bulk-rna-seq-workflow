[project]
name = "complextissue-bulk-rna-seq-pipeline"
version = "0.1.0"
description = "A Snakemake pipeline for bulk RNA sequencing data analysis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "decoupler>=2.1.1",
    "pydeseq2>=0.5.2",
    "pytximport>=0.12.0",
    "ruff>=0.14.1",
    "snakefmt>=0.11.2",
    "snakemake>=9.13.4",
]
